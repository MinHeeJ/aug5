services:
  database:
    image: postgres:16.6-alpine
    pull_policy: if_not_present
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knue}
      POSTGRES_USER: ${POSTGRES_USER:-knue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knue}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    image: knue-common-backend:dev
    build:
      context: ../backend
    pull_policy: build
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-knue}
      DB_USERNAME: ${POSTGRES_USER:-knue}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-knue}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  frontend:
    image: knue-common-frontend:dev
    build:
      context: ../frontend
    pull_policy: build
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
